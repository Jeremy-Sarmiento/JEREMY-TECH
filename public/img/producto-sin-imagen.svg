    <circle cx="565" cy="205" r="7"/>
    <circle cx="215" cy="340" r="6"/>
    <circle cx="585" cy="380" r="4"/>
  </g>

  <text x="400" y="465" text-anchor="middle" fill="#e8f7ff"
