  <rect width="800" height="600" fill="url(#fondo)"/>
  <circle cx="400" cy="270" r="150" fill="none" stroke="#00d4ff" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="400" cy="270" r="190" fill="none" stroke="#00d4ff" stroke-opacity=".08" stroke-width="2"/>

  <g fill="none" stroke="url(#brillo)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
