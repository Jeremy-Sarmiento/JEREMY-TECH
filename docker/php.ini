; Producción: no mostrar errores al cliente, solo registrarlos.
expose_php = Off
display_errors = Off
log_errors = On

; Límites de subida para la imagen de producto (máximo de la app: 3 MB).
; post_max_size deja espacio para el resto de campos del formulario.
upload_max_filesize = 4M
post_max_size = 6M
