# Render inyecta PORT; el entrypoint ajusta el puerto en ports.conf.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa en profundidad: nada fuera de public/ es accesible.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Render captura stdout/stderr; los logs de Apache deben ir ahí.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    <IfModule mod_php.c>
        php_flag expose_php off
        php_flag display_errors off
        php_value upload_max_filesize 8M
        php_value post_max_size 10M
    </IfModule>
</VirtualHost>
