# Render inyecta PORT; el entrypoint ajusta el puerto en ports.conf.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa en profundidad: nada fuera de public/ es accesible.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Render captura stdout/stderr; los logs de Apache deben ir ahí.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
