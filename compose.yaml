# Local: app + PostgreSQL 16.
#   docker compose up -d db                       solo la base, con PHP en tu PC
#   docker compose up -d --build app --no-deps    solo la app, con Supabase
#   docker compose up -d --build                  app y base en Docker
name: proyecto-postgresql

services:
  db:
    build:
      context: docker
      dockerfile: postgres.Dockerfile
    image: jeremy-tech:postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jeremy_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Se importan solos la primera vez que se crea el volumen.
      - ./database/jeremy_tech_estructura.sql:/docker-entrypoint-initdb.d/01-estructura.sql:ro
      - ./database/jeremy_tech_datos.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d jeremy_tech"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: jeremy-tech:tienda
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: jeremy_tech
      DB_USER: postgres
      DB_PASS: admin
      MAIL_STORAGE_PATH: /tmp/jeremy-tech-mail
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Compose lo crea en el primer `up`. `down -v` lo borra con los datos.
  pg-data:
    name: jeremy-tech-pg-data
