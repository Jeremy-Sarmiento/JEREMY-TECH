# Local: app + MariaDB.
#   docker compose up -d db                       solo la base, con PHP en tu PC
#   docker compose up -d --build                  app y base en Docker
services:
  db:
    build:
      context: docker
      dockerfile: mariadb.Dockerfile
    image: jeremy-tech:mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: jeremy_tech
      MARIADB_USER: jeremy
      MARIADB_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Se importan solo la primera vez que se crea el volumen.
      - ./database/jeremy_tech_estructura.sql:/docker-entrypoint-initdb.d/01-estructura.sql:ro
      - ./database/jeremy_tech_datos.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: jeremy-tech:local
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: jeremy_tech
      DB_USER: jeremy
      DB_PASS: admin
      MAIL_STORAGE_PATH: /tmp/jeremy-tech-mail
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Compose lo crea en el primer `up`. `down -v` lo borra con los datos.
  db-data:
    name: jeremy-tech-mariadb-data
