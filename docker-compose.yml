# App Jeremy Tech contra la MariaDB del host (127.0.0.1:3306).
# Con network_mode: host comparte la red del host, así que DB_HOST=127.0.0.1
# apunta a la MariaDB local. No se levanta una BD en Docker.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jeremy-tech-app
    image: jeremy-tech:local
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: jeremy_tech
      DB_USER: root
      DB_PASS: admin
      APP_TIMEZONE: America/Lima
      APP_URL: http://localhost:8080
      MAIL_STORAGE_PATH: /tmp/jeremy-tech-mail
      CHAT_MODE: rules
      PAGOS_MODO: simulado
