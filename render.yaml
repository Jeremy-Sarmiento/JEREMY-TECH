services:
  - type: web
    name: jeremy-tech
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Cadena de conexión de Supabase (Dashboard > Connect > Session pooler).
      # Se pega al crear el servicio; nunca se versiona.
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: America/Lima
      # El disco del contenedor es efímero: los correos simulados viven en /tmp.
      - key: MAIL_STORAGE_PATH
        value: /tmp/jeremy-tech-mail
      - key: CHAT_MODE
        value: rules
      - key: PAGOS_MODO
        value: simulado
